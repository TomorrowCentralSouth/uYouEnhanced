# Original idea by @ISnackable. Thanks to him for handling the hardest parts!
# https://github.com/ISnackable/YTCubePlus/blob/main/.github/workflows/Build.yml

name: Build and Release uYouEnhanced

on:
  workflow_dispatch:
    inputs:
      sdk_version:
        description: "iOS SDK Version"
        default: "17.5"
        required: true
        type: string
      uyou_version:
        description: "uYou Version"
        default: "3.0.4"
        required: true
        type: string
      uyouenhanced_ipa_url:
        description: "Direct URL of the existing uYouEnhanced 20.10.4 IPA"
        default: ""
        required: true
        type: string
      upload_artifact:
        description: "Upload IPA as artifact"
        default: true
        required: false
        type: boolean
  
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build uYouEnhanced
    runs-on: macos-15-intel
    permissions:
      contents: write

    steps:
      - name: Checkout matching uYouEnhanced source
        uses: actions/checkout@v5
        with:
          repository: jaydenjcpy/uYouEnhanced
          ref: v20.10.4-3.0.4-(2)
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: brew install ldid dpkg make

      - name: Set PATH environment variable
        run: echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH 

      - name: Setup Theos
        uses: actions/checkout@v5
        with:
          repository: theos/theos
          ref: 9bc73406cf80b711ef4d02c15ff1dedc4478a275
          path: theos
          submodules: recursive
      
      - name: SDK Caching
        id: SDK
        uses: actions/cache@v4.3.0
        env:
          cache-name: iOS-${{ inputs.sdk_version }}-SDK
        with:
          path: theos/sdks/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Download iOS SDK
        if: steps.SDK.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/aricloverALT/sdks/
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS${{ inputs.sdk_version }}.sdk
          git checkout
          mv *.sdk $THEOS/sdks
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Setup Theos Jailed
        uses: actions/checkout@v5
        with:
          repository: qnblackcat/theos-jailed
          ref: master
          path: theos-jailed
          submodules: recursive

      - name: Install Theos Jailed
        run: |
          ./theos-jailed/install
        env:
          THEOS: ${{ github.workspace }}/theos

      - name: Hash existing uYouEnhanced IPA URL
        run: |
          URL_YT="$(jq -r '.inputs.uyouenhanced_ipa_url' $GITHUB_EVENT_PATH)"
          echo ::add-mask::$URL_YT
          echo URL_YT=$URL_YT >> $GITHUB_ENV

      - name: Prepare existing uYouEnhanced IPA
        id: prepare_youtube
        run: |
          wget "$YOUTUBE_URL" --quiet --no-verbose -O main/YouTube.ipa
          cd ${{ github.workspace }}/main
          mv YouTube.ipa YouTube.zip
          unzip -q YouTube.zip
          youtube_version=$(defaults read "$(pwd)/Payload/YouTube.app/Info" CFBundleVersion)
          echo "==> YouTube v$youtube_version in the supplied IPA"
          if [[ "$youtube_version" != 20.10.4* ]]; then
            echo "Expected the 20.10.4 uYouEnhanced IPA; found $youtube_version"
            exit 1
          fi
          sed -i '' "s/^YOUTUBE_VERSION = .*/YOUTUBE_VERSION = ${youtube_version}/" Makefile
          echo "youtube_version=${youtube_version}" >> $GITHUB_OUTPUT

        env:
          THEOS: ${{ github.workspace }}/theos
          YOUTUBE_URL: ${{ env.URL_YT }}

      - name: Rebuild and replace the existing tweak library
        id: build_package
        run: |
          cd ${GITHUB_WORKSPACE}/main
          sed -i '' "s/^export TARGET = .*/export TARGET = iphone:clang:${{ inputs.sdk_version }}:15.0/" Makefile
          python3 - <<'PY'
          from pathlib import Path
          source = Path('Sources/uYouPlus.xm')
          text = source.read_text()
          marker = '#import "uYouPlusPatches.h"\n'
          patch = '''\n// Enable YouTube's built-in community-post fullscreen image viewer.
          %hook YTGlobalConfig
          - (BOOL)iosEnableBackstageFullscreenImageViewer {
              return YES;
          }
          %end
          \n'''
          if 'iosEnableBackstageFullscreenImageViewer' not in text:
              if marker not in text:
                  raise SystemExit('Could not find patch insertion point in source')
              source.write_text(text.replace(marker, marker + patch, 1))
          PY
          make all THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1
          dylib="$(find .theos/obj/release -type f -name uYouEnhanced.dylib -print -quit)"
          test -n "$dylib"
          target="Payload/YouTube.app/Frameworks/uYouEnhanced.dylib"
          test -f "$target"
          cp "$dylib" "$target"
          rm -f YouTube.zip
          zip -qr patched-uYouEnhanced.ipa Payload
          echo "package=patched-uYouEnhanced.ipa" >> "$GITHUB_OUTPUT"
          shasum -a 256 patched-uYouEnhanced.ipa
        env:
          THEOS: ${{ github.workspace }}/theos
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
      - name: Upload Artifact
        if: ${{ inputs.upload_artifact }}
        uses: actions/upload-artifact@v5
        env:
          UYOU_VERSION: ${{ inputs.uyou_version }}
          YOUTUBE_VERSION: ${{ steps.prepare_youtube.outputs.youtube_version }}
        with:
          name: uYouEnhanced_${{ env.YOUTUBE_VERSION }}_${{ env.UYOU_VERSION }}
          path: ${{ github.workspace }}/main/${{ steps.build_package.outputs.package }}
          if-no-files-found: error

